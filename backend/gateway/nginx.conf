worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss application/atom+xml
               image/svg+xml;

    # Security Headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=otp:10m rate=5r/m;

    # Upstream services
    upstream auth_service {
        least_conn;
        server auth-service:8001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream booking_service {
        least_conn;
        server booking-service:8002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream matching_service {
        least_conn;
        server matching-service:8003 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream payment_service {
        least_conn;
        server payment-service:8004 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream parcel_service {
        least_conn;
        server parcel-service:8005 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream hotel_service {
        least_conn;
        server hotel-service:8006 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream notification_service {
        least_conn;
        server notification-service:8007 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream analytics_service {
        least_conn;
        server analytics-service:8008 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream admin_service {
        least_conn;
        server admin-service:8009 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream websocket_gateway {
        ip_hash;  # Sticky sessions for WebSocket
        server websocket-gateway:8010 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    # ========================================================
    # Main API Server
    # ========================================================
    server {
        listen 80;
        server_name _;

        # Auth endpoints — stricter rate limit
        location /api/v1/auth/otp {
            limit_req zone=otp burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://auth_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /api/v1/auth {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://auth_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /api/v1/admin/auth {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://auth_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /api/v1/profile {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://auth_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # Booking service
        location /api/v1/bookings {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://booking_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /api/v1/trips {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://booking_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /api/v1/addresses {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://booking_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # Matching service
        location /api/v1/matching {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://matching_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /api/v1/tracking {
            limit_req zone=api burst=120 nodelay;
            proxy_pass http://matching_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # Payment service
        location /api/v1/payments {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://payment_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /api/v1/wallet {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://payment_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /api/v1/coupons {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://payment_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /api/v1/referrals {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://payment_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /api/v1/subscriptions {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://payment_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # Parcel service
        location /api/v1/parcels {
            limit_req zone=api burst=30 nodelay;
            client_max_body_size 20M;
            proxy_pass http://parcel_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # Hotel service
        location /api/v1/hotels {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://hotel_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # Notification service
        location /api/v1/notifications {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://notification_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # Analytics & Admin service
        location /api/v1/analytics {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://analytics_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /api/v1/admin {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://admin_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /api/v1/themes {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://admin_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /api/v1/rewards {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://payment_service;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # WebSocket Gateway — Socket.IO
        location /ws/ {
            proxy_pass http://websocket_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /socket.io/ {
            proxy_pass http://websocket_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Static uploads
        location /uploads/ {
            alias /var/www/uploads/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
        }

        # Health check
        location /health {
            access_log off;
            return 200 '{"status":"healthy"}';
            add_header Content-Type application/json;
        }
    }
}
